<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر شحن الألعاب الرقمية - شام كاش</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #0b0f19; color: #f8fafc; }

<body class="bg-[#0b0f19] min-h-screen flex flex-col justify-between p-4">
    <div class="max-w-md mx-auto w-full bg-[#131c2e] border border-[#1e293b] rounded-2xl p-5 shadow-lg my-auto space-y-4">
        
        <div class="text-center">
            <h1 class="text-xl font-bold text-amber-400 mb-1"><i class="fa-solid fa-gamepad"></i> متجر شحن الألعاب</h1>
            <p class="text-xs text-gray-300">اشحن شدات ببجي فوراً عبر التحويل إلى محفظة شام كاش الخاصة بنا</p>
        </div>

        <!-- قسم معلومات شام كاش -->
        <div class="bg-black/30 border border-amber-500/30 rounded-xl p-3 text-center space-y-2">
            <div class="text-xs text-amber-400 font-bold"><i class="fa-solid fa-wallet ml-1"></i> معلومات الدفع عبر شام كاش (Sham Cash)</div>
            <div class="text-[11px] text-gray-300 break-all bg-[#0b0f19] p-2 rounded border border-gray-800 select-all font-mono">
                839875cca2341bad76e1ffe721d13788
            </div>
            <button onclick="copySham()" class="text-xs bg-amber-500/20 text-amber-400 hover:bg-amber-500 hover:text-black font-semibold py-1.5 px-3 rounded-lg transition-all w-full">
                <i class="fa-solid fa-copy ml-1"></i> نسخ معرف محفظة شام كاش
            </button>
        </div>

        <!-- زر التواصل وإتمام الطلب -->
        <div>
            <label class="block text-xs text-gray-300 mb-1">أدخل الآيدي (Player ID) الخاص بك:</label>
            <input type="text" id="playerId" placeholder="مثال: 5123456789" class="w-full bg-black/40 border border-gray-700 rounded-xl px-3 py-2.5 text-sm text-white mb-3 focus:outline-none focus:border-amber-500">
            
            <a href="javascript:void(0);" onclick="sendOrder()" class="block w-full bg-amber-500 hover:bg-amber-600 text-black font-bold text-center py-3 rounded-xl shadow transition-all">
                <i class="fa-brands fa-telegram ml-1 text-lg"></i> إرسال الطل
